<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Absensi Ekskul - SMPN 1 Kaliwedi</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;color:#1a202c;padding:12px;max-width:520px;margin:0 auto;min-height:100vh}
    .app-header{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
    .app-header img{width:64px;height:64px;object-fit:contain;border-radius:8px;flex-shrink:0}
    .app-header .text{flex:1;line-height:1.25}
    .app-header .title{font-size:1.15rem;font-weight:800;color:#2b6cb0}
    .app-header .school{font-size:.88rem;font-weight:600;color:#2d3748;margin-top:1px}
    .app-header .subtitle{font-size:.78rem;color:#718096;margin-top:2px}
    .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
    label{display:block;font-size:.8rem;font-weight:600;color:#4a5568;margin-bottom:4px}
    select,input[type=text],input[type=password],input[type=datetime-local]{width:100%;padding:11px 12px;border:1.5px solid #cbd5e0;border-radius:9px;font-size:1rem;margin-bottom:12px;background:#fff}
    .btn{display:block;width:100%;padding:13px;border:none;border-radius:9px;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:8px}
    .btn-primary{background:#3182ce;color:#fff}
    .btn-success{background:#38a169;color:#fff}
    .btn-danger{background:#e53e3e;color:#fff}
    .btn-outline{background:#fff;border:1.5px solid #3182ce;color:#3182ce}
    .btn-sm{padding:8px 12px;font-size:.85rem;width:auto;display:inline-block}
    #reader{width:100%;border-radius:12px;overflow:hidden;margin-bottom:12px;background:#000}
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(130px);background:#2f855a;color:#fff;padding:16px 24px;border-radius:14px;font-weight:600;font-size:1.1rem;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:9999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);text-align:center;max-width:90%;white-space:pre-line;line-height:1.35}
    .toast.show{transform:translateX(-50%) translateY(0)}
    .toast.error{background:#c53030}
    .list-hadir{max-height:300px;overflow-y:auto}
    .item-hadir{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #edf2f7;font-size:.92rem}
    .item-hadir .nama{font-weight:600}
    .item-hadir .meta{color:#718096;font-size:.8rem}
    .tabs{display:flex;gap:8px;margin-bottom:14px}
    .tab{flex:1;padding:11px;text-align:center;border-radius:9px;font-weight:600;cursor:pointer;background:#e2e8f0;color:#4a5568;font-size:.95rem}
    .tab.active{background:#3182ce;color:#fff}
    .hidden{display:none!important}
    .nav{text-align:center;margin:16px 0}
    .nav span{color:#3182ce;font-weight:600;cursor:pointer;margin:0 6px}
    .status-bar{font-size:.88rem;color:#4a5568;text-align:center;margin-bottom:12px;background:#ebf8ff;padding:8px 12px;border-radius:8px}
    .user-bar{background:#edf2f7;padding:8px 12px;border-radius:8px;font-size:.85rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
    .row{display:flex;gap:10px}.row>div{flex:1}
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th,td{padding:10px 7px;text-align:left;border-bottom:1px solid #edf2f7}
    th{background:#edf2f7;font-weight:600;font-size:.78rem;color:#4a5568}
    .persen{font-weight:700}.baik{color:#38a169}.sedang{color:#d69e2e}.buruk{color:#e53e3e}
    .info{font-size:.85rem;color:#718096;margin-bottom:12px;text-align:center}
    .loading{text-align:center;color:#a0aec0;padding:20px}
  </style>
</head>
<body>

<!-- HEADER -->
<div class="app-header" id="appHeader">
  <img src="https://raw.githubusercontent.com/SMPN1KALIWEDI/ujian-smpn1kaliwedi/main/assets/logo_smp.png" alt="Logo">
  <div class="text">
    <div class="title">EKSTRAKURIKULER</div>
    <div class="school">SMP NEGERI 1 KALIWEDI</div>
    <div class="subtitle">SCAN ABSENSI</div>
  </div>
</div>

<!-- ===== LOGIN ===== -->
<div id="pageLogin">
  <div class="card">
    <h2 style="text-align:center;margin-bottom:16px;color:#2b6cb0">Login</h2>
    <label>Username</label>
    <input type="text" id="loginUser" placeholder="Nama pengguna" autocomplete="username">
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-primary" onclick="doLogin()">Masuk</button>
  </div>
</div>

<!-- ===== SETELAH LOGIN ===== -->
<div id="pageMain" class="hidden">
  <div class="user-bar">
    <span id="userInfo">—</span>
    <button class="btn btn-outline btn-sm" onclick="doLogout()">Keluar</button>
  </div>

  <!-- Menu navigasi role -->
  <div class="card" id="menuCard">
    <div class="tabs" id="mainTabs"></div>
  </div>

  <!-- Halaman Absensi (Petugas / Admin / Pembina) -->
  <div id="sectionAbsen" class="hidden">
    <div class="card" id="setupCard">
      <label>Jenis Kegiatan</label>
      <select id="selKegiatan"><option value="">-- Pilih Kegiatan --</option></select>
      <label>Waktu Mulai</label>
      <input type="datetime-local" id="waktuMulai">
      <label>Waktu Selesai</label>
      <input type="datetime-local" id="waktuSelesai">
      <button class="btn btn-primary" onclick="mulaiAbsen()">Mulai Absensi</button>
    </div>
    <div id="absenArea" class="hidden">
      <div class="card">
        <div class="status-bar" id="statusKegiatan"></div>
        <div class="tabs">
          <div class="tab active" id="tabScan" onclick="switchTab('scan')">📷 Scan QR</div>
          <div class="tab" id="tabManual" onclick="switchTab('manual')">✍️ Manual</div>
        </div>
        <div id="panelScan">
          <div id="reader"></div>
          <button class="btn btn-danger" id="btnStop" onclick="stopScanner()" style="display:none">Stop Kamera</button>
          <button class="btn btn-outline" id="btnStart" onclick="startScanner()">Nyalakan Kamera</button>
        </div>
        <div id="panelManual" class="hidden">
          <label>Kelas</label>
          <select id="selKelas" onchange="filterNama()"><option value="">-- Pilih Kelas --</option></select>
          <label>Nama Siswa</label>
          <select id="selNama"><option value="">-- Pilih Nama --</option></select>
          <button class="btn btn-success" onclick="absenManual()">Catat Hadir</button>
        </div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <strong>Hadir Hari Ini (<span id="jumlahHadir">0</span>)</strong>
          <button class="btn btn-outline btn-sm" onclick="refreshList()">🔄</button>
        </div>
        <div class="list-hadir" id="listHadir"><div class="loading">Belum ada data</div></div>
      </div>
      <button class="btn btn-outline" onclick="selesaiAbsen()">Selesai / Ganti Kegiatan</button>
    </div>
  </div>

  <!-- Halaman Rekap -->
  <div id="sectionRekap" class="hidden">
    <div class="card">
      <div class="row">
        <div><label>Bulan</label><select id="selBulan"></select></div>
        <div><label>Tahun</label><select id="selTahun"></select></div>
      </div>
      <label>Kelas</label>
      <select id="selKelasRekap"><option value="">-- Semua Kelas --</option></select>
      <label>Kegiatan</label>
      <select id="selKegiatanRekap"><option value="">-- Semua Kegiatan --</option></select>
      <button class="btn btn-primary" onclick="loadRekap()">Tampilkan Rekap</button>
    </div>
    <div class="card" id="hasilCard" style="display:none">
      <div class="info" id="infoRekap"></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Hadir</th><th>%</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Halaman Kelola Petugas (Pembina / Admin) -->
  <div id="sectionPetugas" class="hidden">
    <div class="card">
      <h3 style="margin-bottom:12px">Kelola Petugas</h3>
      <label>Nama Petugas</label>
      <input type="text" id="petugasNama" placeholder="Nama petugas">
      <label>Password</label>
      <input type="text" id="petugasPass" placeholder="Password">
      <button class="btn btn-success" onclick="tambahPetugas()">+ Tambah Petugas</button>
    </div>
    <div class="card">
      <strong>Daftar Petugas</strong>
      <div id="listPetugas" style="margin-top:10px"><div class="loading">Memuat...</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbye7N8cp8LLKBGhN1PdkUpz-wK0iFtEXJiVsTUVlYROQ520GIrX68jTor04HkmxAdWu/exec';

let currentUser = null;
let kegiatanList = [], siswaList = [];
let currentKode = '', currentMulai = '', currentSelesai = '';
let html5QrCode = null, isScanning = false, isProcessing = false;
let lastScannedNisn = '', lastScanTime = 0;
const scannedToday = new Set(); // tambahan kunci di memori

async function api(action, params = {}) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k,v]) => { if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v); });
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error('Network error');
  return await res.json();
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ===== LOGIN =====
async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();
  if (!username || !password) return showToast('Isi username dan password', true);
  
  try {
    const res = await api('login', { username, password });
    if (!res.success) return showToast(res.message, true);
    
    currentUser = res;
    localStorage.setItem('ekskul_user', JSON.stringify(res));
    afterLogin();
  } catch(err) {
    showToast('Gagal login: ' + err.message, true);
  }
}

function doLogout() {
  currentUser = null;
  localStorage.removeItem('ekskul_user');
  stopScanner();
  document.getElementById('pageMain').classList.add('hidden');
  document.getElementById('pageLogin').classList.remove('hidden');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

function afterLogin() {
  document.getElementById('pageLogin').classList.add('hidden');
  document.getElementById('pageMain').classList.remove('hidden');
  document.getElementById('userInfo').textContent = currentUser.nama + ' (' + currentUser.status + ')';
  
  // Build tabs sesuai role
  const tabs = document.getElementById('mainTabs');
  tabs.innerHTML = '';
  
  if (currentUser.status === 'Admin' || currentUser.status === 'Pembina' || currentUser.status === 'Petugas') {
    tabs.innerHTML += `<div class="tab active" data-sec="absen" onclick="showSection('absen')">📋 Absensi</div>`;
  }
  if (currentUser.status === 'Admin' || currentUser.status === 'Pembina') {
    tabs.innerHTML += `<div class="tab" data-sec="rekap" onclick="showSection('rekap')">📊 Rekap</div>`;
  }
  if (currentUser.status === 'Admin' || currentUser.status === 'Pembina') {
    tabs.innerHTML += `<div class="tab" data-sec="petugas" onclick="showSection('petugas')">👥 Petugas</div>`;
  }
  
  showSection('absen');
  loadInitialData();
}

function showSection(sec) {
  document.querySelectorAll('#mainTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.sec === sec));
  document.getElementById('sectionAbsen').classList.toggle('hidden', sec !== 'absen');
  document.getElementById('sectionRekap').classList.toggle('hidden', sec !== 'rekap');
  document.getElementById('sectionPetugas').classList.toggle('hidden', sec !== 'petugas');
  if (sec === 'petugas') loadPetugas();
  if (sec !== 'absen') stopScanner();
}

async function loadInitialData() {
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('waktuMulai').value = now.toISOString().slice(0,16);
  const end = new Date(now.getTime() + 2*60*60*1000);
  document.getElementById('waktuSelesai').value = end.toISOString().slice(0,16);

  const bulanNama = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const selB = document.getElementById('selBulan');
  selB.innerHTML = '';
  bulanNama.forEach((b,i) => {
    const opt = document.createElement('option');
    opt.value = i+1; opt.textContent = b;
    if (i === now.getMonth()) opt.selected = true;
    selB.appendChild(opt);
  });
  const selT = document.getElementById('selTahun');
  selT.innerHTML = '';
  for (let y = now.getFullYear(); y >= now.getFullYear()-2; y--) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    selT.appendChild(opt);
  }

  try {
    kegiatanList = await api('getKegiatan');
    const sel = document.getElementById('selKegiatan');
    const selR = document.getElementById('selKegiatanRekap');
    sel.innerHTML = '<option value="">-- Pilih Kegiatan --</option>';
    selR.innerHTML = '<option value="">-- Semua Kegiatan --</option>';
    
    // Filter kegiatan sesuai role
    let list = kegiatanList;
    if (currentUser.status === 'Pembina' || currentUser.status === 'Petugas') {
      // hanya kegiatan yang sesuai
      const kegUser = currentUser.kegiatan;
      list = kegiatanList.filter(k => k.nama === kegUser || k.kode === kegUser);
      if (list.length === 0) list = kegiatanList; // fallback
    }
    
    list.forEach(k => {
      sel.innerHTML += `<option value="${k.kode}">${k.nama} (${k.kode})</option>`;
      selR.innerHTML += `<option value="${k.kode}">${k.nama}</option>`;
    });
    
    // Auto select jika hanya 1
    if (list.length === 1) sel.value = list[0].kode;

    siswaList = await api('getSiswa');
    const kelas = [...new Set(siswaList.map(s => s.kelas))].filter(Boolean).sort();
    const selK = document.getElementById('selKelas');
    const selKR = document.getElementById('selKelasRekap');
    selK.innerHTML = '<option value="">-- Pilih Kelas --</option>';
    selKR.innerHTML = '<option value="">-- Semua Kelas --</option>';
    kelas.forEach(k => {
      selK.innerHTML += `<option value="${k}">${k}</option>`;
      selKR.innerHTML += `<option value="${k}">${k}</option>`;
    });
  } catch(err) {
    showToast('Gagal memuat data: ' + err.message, true);
  }
}

// ===== ABSENSI =====
function mulaiAbsen() {
  const kode = document.getElementById('selKegiatan').value;
  const mulai = document.getElementById('waktuMulai').value;
  const selesai = document.getElementById('waktuSelesai').value;
  if (!kode) return showToast('Pilih kegiatan dulu', true);
  if (!mulai || !selesai) return showToast('Isi waktu mulai & selesai', true);

  currentKode = kode;
  currentMulai = mulai;
  currentSelesai = selesai;
  scannedToday.clear(); // reset per sesi (server tetap cek)

  const namaKeg = kegiatanList.find(k => k.kode === kode)?.nama || kode;
  document.getElementById('statusKegiatan').textContent =
    namaKeg + ' • ' + mulai.replace('T',' ').slice(0,16) + ' s/d ' + selesai.slice(11,16);

  document.getElementById('setupCard').classList.add('hidden');
  document.getElementById('absenArea').classList.remove('hidden');
  refreshList();
  startScanner();
}

function selesaiAbsen() {
  stopScanner();
  document.getElementById('absenArea').classList.add('hidden');
  document.getElementById('setupCard').classList.remove('hidden');
  currentKode = '';
  isProcessing = false;
}

function switchTab(tab) {
  document.getElementById('tabScan').classList.toggle('active', tab === 'scan');
  document.getElementById('tabManual').classList.toggle('active', tab === 'manual');
  document.getElementById('panelScan').classList.toggle('hidden', tab !== 'scan');
  document.getElementById('panelManual').classList.toggle('hidden', tab !== 'manual');
  if (tab === 'scan') startScanner(); else stopScanner();
}

function filterNama() {
  const kelas = document.getElementById('selKelas').value;
  const sel = document.getElementById('selNama');
  sel.innerHTML = '<option value="">-- Pilih Nama --</option>';
  siswaList.filter(s => !kelas || s.kelas === kelas)
    .sort((a,b) => a.nama.localeCompare(b.nama))
    .forEach(s => { sel.innerHTML += `<option value="${s.nisn}">${s.nama}</option>`; });
}

function absenManual() {
  const nisn = document.getElementById('selNama').value;
  if (!nisn) return showToast('Pilih nama siswa', true);
  prosesAbsen(nisn);
}

async function prosesAbsen(nisn) {
  if (!currentKode || isProcessing) return;
  
  // Kunci memori: 1 NISN hanya 1x per sesi hari ini
  if (scannedToday.has(nisn)) {
    showToast('Absensi sudah dilakukan', true);
    return;
  }
  
  const now = Date.now();
  if (nisn === lastScannedNisn && (now - lastScanTime) < 6000) return;

  isProcessing = true;
  lastScannedNisn = nisn;
  lastScanTime = now;

  try {
    const res = await api('catatAbsen', {
      nisn, kode: currentKode, mulai: currentMulai, selesai: currentSelesai
    });

    if (res.success) {
      scannedToday.add(nisn);
      showToast(res.nama + '\n' + res.kelas);
      refreshList();
    } else {
      // Jika server bilang sudah absen, kunci juga di memori
      if (res.message && res.message.includes('sudah')) scannedToday.add(nisn);
      showToast(res.message + (res.nama ? '\n' + res.nama : ''), true);
    }
  } catch(err) {
    showToast('Error: ' + err.message, true);
  } finally {
    setTimeout(() => { isProcessing = false; }, 4000);
  }
}

async function refreshList() {
  if (!currentKode) return;
  try {
    const data = await api('getAbsenHariIni', { kode: currentKode });
    document.getElementById('jumlahHadir').textContent = data ? data.length : 0;
    const el = document.getElementById('listHadir');
    if (!data || !data.length) {
      el.innerHTML = '<div class="loading">Belum ada data</div>';
      return;
    }
    el.innerHTML = data.map(d => `
      <div class="item-hadir">
        <div><div class="nama">${d.nama}</div><div class="meta">${d.kelas} • ${d.nisn}</div></div>
        <div class="meta">${d.waktu}</div>
      </div>`).join('');
  } catch(err) {
    document.getElementById('listHadir').innerHTML = '<div class="loading">Gagal memuat</div>';
  }
}

// ===== SCANNER =====
function startScanner() {
  if (isScanning) return;
  const reader = document.getElementById('reader');
  reader.innerHTML = '';
  html5QrCode = new Html5Qrcode('reader');
  
  html5QrCode.start(
    { facingMode: 'environment' },
    { fps: 12, qrbox: { width: 220, height: 220 } },
    (decodedText) => {
      if (isProcessing || !isScanning) return;
      const nisn = decodedText.trim().replace(/\D/g,'') || decodedText.trim();
      try { html5QrCode.pause(true); } catch(e){}
      prosesAbsen(nisn);
      setTimeout(() => {
        if (html5QrCode && isScanning) try { html5QrCode.resume(); } catch(e){}
      }, 4000);
    },
    () => {}
  ).then(() => {
    isScanning = true;
    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('btnStop').style.display = 'block';
  }).catch(err => {
    showToast(err.name === 'NotAllowedError' ? 'Izinkan akses kamera' : 'Kamera gagal', true);
    document.getElementById('btnStart').style.display = 'block';
  });
}

function stopScanner() {
  if (html5QrCode) {
    html5QrCode.stop().then(() => {
      html5QrCode.clear();
      isScanning = false;
      isProcessing = false;
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnStop').style.display = 'none';
    }).catch(() => { isScanning = false; isProcessing = false; });
  }
}

// ===== REKAP =====
async function loadRekap() {
  const bulan = document.getElementById('selBulan').value;
  const tahun = document.getElementById('selTahun').value;
  const kelas = document.getElementById('selKelasRekap').value;
  const kode = document.getElementById('selKegiatanRekap').value;
  try {
    const res = await api('getRekap', { bulan, tahun, kelas, kode });
    document.getElementById('hasilCard').style.display = 'block';
    const bulanNama = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    document.getElementById('infoRekap').textContent =
      res.namaKegiatan + ' • ' + bulanNama[bulan-1] + ' ' + tahun + ' • Total pertemuan: ' + res.totalPertemuan;
    const tbody = document.getElementById('tbody');
    if (!res.data || !res.data.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#a0aec0">Tidak ada data</td></tr>';
      return;
    }
    tbody.innerHTML = res.data.map((d,i) => {
      const cls = d.persen < 50 ? 'buruk' : (d.persen < 75 ? 'sedang' : 'baik');
      return `<tr><td>${i+1}</td><td>${d.nama}</td><td>${d.kelas}</td><td>${d.hadir}/${d.total}</td><td class="persen ${cls}">${d.persen}%</td></tr>`;
    }).join('');
  } catch(err) {
    showToast('Gagal rekap: ' + err.message, true);
  }
}

// ===== PETUGAS =====
async function loadPetugas() {
  const el = document.getElementById('listPetugas');
  try {
    const data = await api('getPetugas', { kegiatan: currentUser.kegiatan });
    if (!data.length) {
      el.innerHTML = '<div class="loading">Belum ada petugas</div>';
      return;
    }
    el.innerHTML = data.map(p => `
      <div class="item-hadir">
        <div><div class="nama">${p.nama}</div><div class="meta">${p.kegiatan}</div></div>
        <button class="btn btn-danger btn-sm" onclick="hapusPetugas('${p.nama}','${p.kegiatan}')">Hapus</button>
      </div>`).join('');
  } catch(err) {
    el.innerHTML = '<div class="loading">Gagal memuat</div>';
  }
}

async function tambahPetugas() {
  const nama = document.getElementById('petugasNama').value.trim();
  const pass = document.getElementById('petugasPass').value.trim();
  if (!nama || !pass) return showToast('Isi nama & password', true);
  
  try {
    const res = await api('tambahPetugas', {
      nama, kegiatan: currentUser.kegiatan, password: pass
    });
    showToast(res.message, !res.success);
    if (res.success) {
      document.getElementById('petugasNama').value = '';
      document.getElementById('petugasPass').value = '';
      loadPetugas();
    }
  } catch(err) {
    showToast(err.message, true);
  }
}

async function hapusPetugas(nama, kegiatan) {
  if (!confirm('Hapus petugas ' + nama + '?')) return;
  try {
    const res = await api('hapusPetugas', { nama, kegiatan });
    showToast(res.message, !res.success);
    loadPetugas();
  } catch(err) {
    showToast(err.message, true);
  }
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('ekskul_user');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      afterLogin();
    } catch(e) {
      localStorage.removeItem('ekskul_user');
    }
  }
});
</script>
