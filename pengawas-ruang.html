<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pengawas Ruang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --navy-950:#0F1B33;
    --navy-800:#1B2A4A;
    --navy-700:#243a63;
    --teal-500:#17A6A0;
    --teal-400:#3FC7C1;
    --amber-500:#E2A63B;
    --red-500:#E15C5C;
    --bg:#F3F5F9;
    --card:#FFFFFF;
    --ink:#151A26;
    --ink-soft:#5B6478;
    --ring-track:#E4E8F0;
    --radius-lg:22px;
    --radius-md:14px;
    --shadow:0 10px 30px -12px rgba(15,27,51,0.25);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 20px 40px;
  }
  .hidden{display:none !important;}

  /* ---------- Header ---------- */
  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-bottom:26px;
    text-align:center;
  }
  .brand-badge{
    width:56px;height:56px;border-radius:16px;
    background:linear-gradient(155deg,var(--navy-800),var(--navy-950));
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
    margin-bottom:6px;
  }
  .brand-badge svg{width:30px;height:30px;}
  .brand h1{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size:22px;
    margin:0;
    color:var(--navy-950);
    letter-spacing:-0.3px;
  }
  .brand p{
    margin:0;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
  }

  /* ---------- Card ---------- */
  .card{
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:26px 22px;
  }

  /* ---------- Form ---------- */
  .field{margin-bottom:18px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--navy-800);
    margin-bottom:8px;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .field input{
    width:100%;
    padding:16px 16px;
    font-size:16px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    border:2px solid var(--ring-track);
    border-radius:var(--radius-md);
    background:#FAFBFD;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  .field input:focus{
    border-color:var(--teal-500);
    background:#fff;
  }
  .field input::placeholder{color:#A7AEC0;}

  .btn{
    width:100%;
    border:none;
    border-radius:var(--radius-md);
    padding:17px 18px;
    font-size:16px;
    font-family:'Poppins',sans-serif;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:linear-gradient(135deg,var(--teal-500),var(--navy-800));
    color:#fff;
    box-shadow:0 8px 20px -8px rgba(23,166,160,0.55);
  }
  .btn-primary:disabled{
    opacity:0.5;
    cursor:not-allowed;
    box-shadow:none;
  }
  .btn-ghost{
    background:#EEF1F6;
    color:var(--navy-800);
    margin-top:10px;
  }
  .btn svg{width:18px;height:18px;flex-shrink:0;}

  .status-msg{
    margin-top:14px;
    font-size:13.5px;
    font-weight:600;
    text-align:center;
    min-height:18px;
  }
  .status-msg.ok{color:var(--teal-500);}
  .status-msg.err{color:var(--red-500);}

  .spinner{
    width:18px;height:18px;
    border:2.5px solid rgba(255,255,255,0.4);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Token screen ---------- */
  .token-meta{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:20px;
  }
  .token-meta .chip{
    flex:1;
    background:#F0F3F9;
    border-radius:12px;
    padding:10px 12px;
    text-align:center;
  }
  .token-meta .chip .label{
    font-size:10.5px;
    font-weight:700;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-bottom:3px;
  }
  .token-meta .chip .value{
    font-size:13.5px;
    font-weight:700;
    color:var(--navy-950);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .qr-stage{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    max-width:280px;
    margin:0 auto 20px;
    background:#fff;
    border-radius:var(--radius-md);
    border:2px solid var(--ring-track);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .qr-stage img,.qr-stage canvas{
    width:82% !important;
    height:82% !important;
  }
  .live-dot{
    position:absolute;
    top:10px;right:10px;
    display:flex;align-items:center;gap:6px;
    background:rgba(15,27,51,0.9);
    padding:4px 9px 4px 7px;
    border-radius:999px;
  }
  .live-dot .pulse{
    width:7px;height:7px;border-radius:50%;
    background:var(--teal-400);
    animation:pulse 1.6s ease-in-out infinite;
  }
  .live-dot span{color:#fff;font-size:10px;font-weight:700;letter-spacing:0.5px;}
  @keyframes pulse{
    0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(63,199,193,0.5);}
    50%{opacity:0.6;box-shadow:0 0 0 5px rgba(63,199,193,0);}
  }
  .qr-loading{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    color:var(--ink-soft);font-size:12.5px;font-weight:600;
  }
  .qr-loading .spinner{border-color:rgba(23,42,74,0.15);border-top-color:var(--navy-800);}
  .qr-error{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    color:var(--red-500);font-size:12.5px;font-weight:600;text-align:center;padding:0 16px;
  }

  .refresh-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:6px;
  }
  .ring-btn{
    position:relative;
    width:64px;height:64px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    background:conic-gradient(var(--teal-500) calc(var(--pct,0)*1%), var(--ring-track) 0);
    transition:transform .12s ease;
  }
  .ring-btn:active{transform:scale(0.94);}
  .ring-btn::after{
    content:'';
    position:absolute;
    inset:5px;
    border-radius:50%;
    background:var(--card);
  }
  .ring-btn svg{
    position:relative;z-index:1;
    width:22px;height:22px;
    color:var(--navy-800);
    transition:transform .5s ease;
  }
  .ring-btn.spinning svg{animation:spin .8s linear infinite;}

  .refresh-info{
    text-align:center;
  }
  .refresh-info .countdown{
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
    font-weight:700;
    color:var(--navy-950);
    letter-spacing:0.5px;
  }
  .refresh-info .caption{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:600;
    margin-top:2px;
  }

  .updated-at{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:500;
    margin-top:16px;
  }

  .back-link{
    display:block;
    text-align:center;
    margin-top:18px;
    font-size:13px;
    font-weight:700;
    color:var(--navy-700);
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
</style>
</head>
<body>
<div id="app">

  <div class="brand">
    <div class="brand-badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3.4" stroke="white" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="1.1" fill="white"/>
      </svg>
    </div>
    <h1>Pengawas Ruang</h1>
    <p>SMP Negeri 1 Kaliwedi</p>
  </div>

  <!-- ===================== SCREEN 1 : JENDELA MASUK ===================== -->
  <div id="screenEntry" class="card">
    <div class="field">
      <label for="inputRuang">Ruang Asesmen</label>
      <input id="inputRuang" type="text" placeholder="Contoh: Ruang 7A" autocomplete="off">
    </div>
    <div class="field">
      <label for="inputPengawas">Nama Pengawas</label>
      <input id="inputPengawas" type="text" placeholder="Nama lengkap pengawas" autocomplete="off">
    </div>
    <button id="btnBukaToken" class="btn btn-primary" disabled>
      <span id="btnBukaTokenLabel">Buka Token</span>
    </button>
    <div id="entryStatus" class="status-msg"></div>
  </div>

  <!-- ===================== SCREEN 2 : TOKEN QR ===================== -->
  <div id="screenToken" class="card hidden">
    <div class="token-meta">
      <div class="chip">
        <div class="label">Ruang</div>
        <div class="value" id="metaRuang">-</div>
      </div>
      <div class="chip">
        <div class="label">Pengawas</div>
        <div class="value" id="metaPengawas">-</div>
      </div>
    </div>

    <div class="qr-stage" id="qrStage">
      <div class="live-dot"><span class="pulse"></span><span>LIVE</span></div>
      <div class="qr-loading" id="qrLoading">
        <div class="spinner"></div>
        <span>Memuat token…</span>
      </div>
      <div id="qrCanvasWrap" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;"></div>
    </div>

    <div class="refresh-row">
      <div class="refresh-info">
        <div class="countdown" id="countdownText">05:00</div>
        <div class="caption">refresh otomatis</div>
      </div>
      <div class="ring-btn" id="btnRefresh" style="--pct:0;">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M21 3v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <div class="updated-at" id="updatedAt">-</div>
    <div class="back-link" id="btnKembali">← Kembali ke jendela masuk</div>
  </div>

</div>

<script>
/* =========================================================
   KONFIGURASI
   Ganti APPS_SCRIPT_URL dengan URL Web App hasil deploy
   Google Apps Script (lihat catatan penyerahan).
========================================================= */
const CONFIG = {
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyI3ZLv-jOhSxINB10yz8wMuUPwPUo3VeSw6hrkLCFdsuM8Hka49cvfBNzePgfgJAYbow/exec',
  REFRESH_INTERVAL_MS: 5 * 60 * 1000 // 5 menit
};

/* =========================================================
   PWA MANIFEST (embedded, tanpa file terpisah)
========================================================= */
(function setupManifest(){
  const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512">
    <rect width="24" height="24" rx="5" fill="#0F1B33"/>
    <path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="#3FC7C1" stroke-width="1.6" fill="none"/>
    <circle cx="12" cy="12" r="3.2" stroke="#3FC7C1" stroke-width="1.6" fill="none"/>
    <circle cx="12" cy="12" r="1" fill="#3FC7C1"/>
  </svg>`;
  const iconUrl = 'data:image/svg+xml;base64,' + btoa(iconSvg);
  const manifest = {
    id: 'pengawas-ruang-smpn1kaliwedi',
    name: 'Pengawas Ruang - SMPN 1 Kaliwedi',
    short_name: 'Pengawas Ruang',
    start_url: '.',
    display: 'standalone',
    background_color: '#F3F5F9',
    theme_color: '#0F1B33',
    icons: [
      { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);

  const linkIcon = document.createElement('link');
  linkIcon.rel = 'icon';
  linkIcon.href = iconUrl;
  document.head.appendChild(linkIcon);
})();

/* =========================================================
   STATE
========================================================= */
let refreshTimer = null;
let countdownTimer = null;
let secondsLeft = CONFIG.REFRESH_INTERVAL_MS / 1000;
let qrObj = null;

const els = {
  inputRuang: document.getElementById('inputRuang'),
  inputPengawas: document.getElementById('inputPengawas'),
  btnBukaToken: document.getElementById('btnBukaToken'),
  btnBukaTokenLabel: document.getElementById('btnBukaTokenLabel'),
  entryStatus: document.getElementById('entryStatus'),
  screenEntry: document.getElementById('screenEntry'),
  screenToken: document.getElementById('screenToken'),
  metaRuang: document.getElementById('metaRuang'),
  metaPengawas: document.getElementById('metaPengawas'),
  qrStage: document.getElementById('qrStage'),
  qrLoading: document.getElementById('qrLoading'),
  qrCanvasWrap: document.getElementById('qrCanvasWrap'),
  countdownText: document.getElementById('countdownText'),
  btnRefresh: document.getElementById('btnRefresh'),
  updatedAt: document.getElementById('updatedAt'),
  btnKembali: document.getElementById('btnKembali'),
};

/* =========================================================
   VALIDASI FORM
========================================================= */
function validateForm(){
  const ok = els.inputRuang.value.trim().length > 0 && els.inputPengawas.value.trim().length > 0;
  els.btnBukaToken.disabled = !ok;
}
els.inputRuang.addEventListener('input', validateForm);
els.inputPengawas.addEventListener('input', validateForm);

/* =========================================================
   SIMPAN DATA PENGAWAS KE SHEET (via Apps Script)
========================================================= */
async function simpanPengawas(ruang, pengawas){
  const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'simpan', ruang, pengawas })
  });
  const json = await res.json();
  if (json.status !== 'ok') throw new Error(json.message || 'Gagal menyimpan data');
  return json;
}

els.btnBukaToken.addEventListener('click', async () => {
  const ruang = els.inputRuang.value.trim();
  const pengawas = els.inputPengawas.value.trim();
  if (!ruang || !pengawas) return;

  els.btnBukaToken.disabled = true;
  els.btnBukaTokenLabel.innerHTML = '<span class="spinner"></span>';
  els.entryStatus.textContent = '';
  els.entryStatus.className = 'status-msg';

  try {
    await simpanPengawas(ruang, pengawas);
    els.metaRuang.textContent = ruang;
    els.metaRuang.title = ruang;
    els.metaPengawas.textContent = pengawas;
    els.metaPengawas.title = pengawas;
    openTokenScreen();
  } catch (err) {
    els.entryStatus.textContent = 'Gagal menyimpan data. Periksa koneksi lalu coba lagi.';
    els.entryStatus.className = 'status-msg err';
  } finally {
    els.btnBukaToken.disabled = false;
    els.btnBukaTokenLabel.textContent = 'Buka Token';
    validateForm();
  }
});

/* =========================================================
   AMBIL NILAI TOKEN (sumber data tidak ditampilkan ke UI;
   permintaan hanya menuju Apps Script milik aplikasi ini)
========================================================= */
async function ambilTokenValue(){
  const res = await fetch(CONFIG.APPS_SCRIPT_URL + '?action=token', { method: 'GET' });
  const json = await res.json();
  if (json.status !== 'ok' || !json.value) throw new Error('Token tidak tersedia');
  return json.value;
}

function renderQR(value){
  els.qrCanvasWrap.innerHTML = '';
  qrObj = new QRCode(els.qrCanvasWrap, {
    text: value,
    width: 260,
    height: 260,
    colorDark: '#0F1B33',
    colorLight: '#FFFFFF',
    correctLevel: QRCode.CorrectLevel.M
  });
}

function formatJam(d){
  return d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

async function loadToken(showSpinnerOverlay){
  if (showSpinnerOverlay){
    els.qrLoading.classList.remove('hidden');
    els.qrCanvasWrap.style.opacity = '0.25';
  }
  els.btnRefresh.classList.add('spinning');

  try {
    const value = await ambilTokenValue();
    renderQR(value);
    els.qrLoading.classList.add('hidden');
    els.qrCanvasWrap.style.opacity = '1';
    els.updatedAt.textContent = 'Diperbarui pukul ' + formatJam(new Date());
    resetCountdown();
  } catch (err) {
    els.qrCanvasWrap.innerHTML = '<div class="qr-error">Token belum bisa dimuat.<br>Coba refresh kembali.</div>';
    els.qrLoading.classList.add('hidden');
    els.qrCanvasWrap.style.opacity = '1';
    els.updatedAt.textContent = 'Gagal memuat pada ' + formatJam(new Date());
  } finally {
    els.btnRefresh.classList.remove('spinning');
  }
}

/* =========================================================
   COUNTDOWN + AUTO REFRESH 5 MENIT
========================================================= */
function resetCountdown(){
  secondsLeft = CONFIG.REFRESH_INTERVAL_MS / 1000;
  updateCountdownUI();
}
function updateCountdownUI(){
  const m = Math.floor(secondsLeft / 60).toString().padStart(2,'0');
  const s = Math.floor(secondsLeft % 60).toString().padStart(2,'0');
  els.countdownText.textContent = `${m}:${s}`;
  const pct = 100 - (secondsLeft / (CONFIG.REFRESH_INTERVAL_MS/1000) * 100);
  els.btnRefresh.style.setProperty('--pct', pct.toFixed(1));
}
function startTimers(){
  stopTimers();
  countdownTimer = setInterval(() => {
    secondsLeft -= 1;
    if (secondsLeft <= 0){
      loadToken(false);
      return;
    }
    updateCountdownUI();
  }, 1000);
}
function stopTimers(){
  if (countdownTimer) clearInterval(countdownTimer);
  if (refreshTimer) clearInterval(refreshTimer);
  countdownTimer = null;
  refreshTimer = null;
}

els.btnRefresh.addEventListener('click', () => loadToken(true));

/* =========================================================
   NAVIGASI ANTAR LAYAR
========================================================= */
function openTokenScreen(){
  els.screenEntry.classList.add('hidden');
  els.screenToken.classList.remove('hidden');
  els.qrCanvasWrap.innerHTML = '';
  els.qrLoading.classList.remove('hidden');
  loadToken(true);
  startTimers();
}
function closeTokenScreen(){
  stopTimers();
  els.screenToken.classList.add('hidden');
  els.screenEntry.classList.remove('hidden');
  els.entryStatus.textContent = '';
}
els.btnKembali.addEventListener('click', closeTokenScreen);

validateForm();
</script>
</body>
</html>
